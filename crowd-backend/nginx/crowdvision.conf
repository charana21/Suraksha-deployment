server {

    listen 80;

    server_name _;  # Listen on all hostnames/IPs
 
    # Root directory for the frontend build

    root /opt/crowdvision/frontend;

    index index.html;
 
    # Basic Auth Protection

    auth_basic "Restricted Access";

    auth_basic_user_file /etc/nginx/.htpasswd;
 
    # 1. Serve Frontend (SPA Support)

    location / {

        try_files $uri $uri/ /index.html;

    }
 
    # 2. Reverse Proxy for API

    location /api {

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

    }
 
    # 3. Reverse Proxy for WebSockets (if separate or under /ws)

    location /ws {

        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

    }
 
    # Increase body size for file uploads if needed

    client_max_body_size 50M;

}

 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdvision-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdvision-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdvision-frontend
    spec:
      containers:
        - name: frontend
          image: registry.example.com/crowdvision/crowd-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crowdvision-frontend
spec:
  selector:
    app.kubernetes.io/name: crowdvision-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
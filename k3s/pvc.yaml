apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdvision-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # K3s normally provides the local-path storage class. Change this for
  # Longhorn, NFS, or another production storage backend.
  storageClassName: local-path
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdvision-config
data:
  APP_ENV: "development"
  LOG_LEVEL: "INFO"
  LOG_FILE: ""
  API_HOST: "0.0.0.0"
  API_PORT: "80"
  API_WORKERS: "1"
  DEVICE: "cuda"
  USE_GPU: "true"
  USE_SHARED_MODEL_POOL: "true"
  USE_BATCHED_INFERENCE: "true"
  YOLO_MODEL_PATH: "/app/data/weights/yolov8m.pt"
  PET_WEIGHTS_PATH: "/app/data/weights/SHB_model.pth"
  UPLOAD_DIR: "/app/data/uploads"
  OUTPUT_DIR: "/app/data/outputs"
  HEATMAP_DIR: "/app/data/heatmaps"
  ANALYTICS_DIR: "/app/data/analytics"
  IMAGES_DIR: "/app/data/images"
  SAVE_HEATMAPS: "false"
  RTSP_DEFAULT_FPS: "1"
  RTSP_RECONNECT_ATTEMPTS: "10"
  RTSP_RECONNECT_DELAY: "5.0"
  MONGODB_DATABASE: "crowdvision_test"
  MONGODB_MAX_POOL_SIZE: "100"
  EXTRA_ALLOWED_ORIGINS: "https://crowdvision.example.com"
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdvision-config
data:
  APP_ENV: "development"
  LOG_LEVEL: "INFO"
  LOG_FILE: ""
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  auth_enabled: "false"
  DEVICE: "cuda"
  USE_GPU: "true"
  USE_SHARED_MODEL_POOL: "true"
  USE_BATCHED_INFERENCE: "true"
  INFERENCE_QUEUE_SIZE: "100"
  INFERENCE_PER_CAMERA_LIMIT: "2"
  BATCH_YOLO_SIZE: "16"
  PET_INFERENCE_INTERVAL: "3"
  CAMERA_SHARD_COUNT: "1"
  HEADLESS_SERVICE_NAME: "crowdvision-backend-headless"
  HEADLESS_SERVICE_PORT: "8000"
  LIVE_STREAM_MAX_FPS: "25"
  ENABLE_LIVE_FRAME_TELEMETRY: "true"
  ZONE_ANALYTICS_CACHE_TTL: "30.0"
  YOLO_MODEL_PATH: "/app/data/weights/yolov8m.pt"
  PET_WEIGHTS_PATH: "/app/data/weights/SHB_model.pth"
  UPLOAD_DIR: "/app/data/uploads"
  OUTPUT_DIR: "/app/data/outputs"
  HEATMAP_DIR: "/app/data/heatmaps"
  ANALYTICS_DIR: "/app/data/analytics"
  IMAGES_DIR: "/app/data/images"
  SAVE_HEATMAPS: "false"
  RTSP_DEFAULT_FPS: "1"
  RTSP_RECONNECT_ATTEMPTS: "10"
  RTSP_RECONNECT_DELAY: "5.0"
  MONGODB_DATABASE: "crowdvision_test"
  MONGODB_MAX_POOL_SIZE: "100"
  EXTRA_ALLOWED_ORIGINS: ""
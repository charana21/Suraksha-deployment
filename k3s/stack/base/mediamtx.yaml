apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
data:
  mediamtx.yml: |
    logLevel: info
    logDestinations: [stdout]
    rtspAddress: :8554
    hlsAddress: :8888
    webrtcAddress: :8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mediamtx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediamtx
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.9.3
          ports:
            - name: rtsp
              containerPort: 8554
            - name: hls
              containerPort: 8888
            - name: webrtc
              containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
---
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
spec:
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: rtsp
      port: 8554
      targetPort: rtsp
    - name: hls
      port: 8888
      targetPort: hls
    - name: webrtc
      port: 8889
      targetPort: webrtc
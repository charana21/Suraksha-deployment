apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdvision-backend
  labels:
    app.kubernetes.io/name: crowdvision-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdvision-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdvision-backend
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: registry.example.com/crowdvision/crowd-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: crowdvision-config
            - secretRef:
                name: crowdvision-secrets
          volumeMounts:
            - name: application-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /api/health/simple
              port: http
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/simple
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: application-data
          persistentVolumeClaim:
            claimName: crowdvision-data
      nodeSelector:
        crowdvision/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule